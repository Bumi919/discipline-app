<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Discipline — Checklist &amp; Statistik Harian</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <h1>Daily Discipline</h1>
      </div>
    </header>

    <div class="dashboard">
      <!-- ============ DAILY ACTIVITIES (kesamping) ============ -->
      <section class="panel">
        <div class="panel-head">
          <h2>Daily Activities</h2>
          <div class="toolbar mini">
            <button id="prev-month2" class="icon-btn" title="Bulan sebelumnya">‹</button>
            <button id="picker-trigger" class="month-trigger" title="Pilih bulan & tahun">
              <span id="month-label2" class="month-label">—</span><i class="chev">▾</i>
            </button>
            <button id="next-month2" class="icon-btn" title="Bulan berikutnya">›</button>
            <div class="month-picker" id="month-picker">
              <div class="mp-head">
                <button class="mp-ybtn" id="mp-prev-year" title="Tahun sebelumnya">‹</button>
                <b id="mp-year">—</b>
                <button class="mp-ybtn" id="mp-next-year" title="Tahun berikutnya">›</button>
              </div>
              <div class="mp-grid" id="mp-grid"></div>
            </div>
          </div>
        </div>

        <div class="grid-scroll" id="grid-scroll">
          <table class="sheet matrix" id="matrix"></table>
        </div>
      </section>

      <!-- ============ STATISTIK & DISCIPLINE LEVEL ============ -->
      <section class="panel">
        <div class="panel-head">
          <h2>Statistik</h2>
          <span class="muted" id="month-label">—</span>
        </div>

        <div class="stat-hero">
          <div class="ring" id="ring-progres">
            <div class="ring-hole">
              <b id="ring-pct">0%</b>
              <small>progres</small>
            </div>
          </div>
          <div class="cards" id="summary-grid"></div>
        </div>

        <div class="card-inner">
          <h3>Discipline Level</h3>
          <div class="donut-wrap">
            <div class="donut" id="donut-dist">
              <div class="donut-hole"><b id="donut-total">0%</b></div>
            </div>
            <ul class="donut-legend" id="donut-legend"></ul>
          </div>
        </div>

        <div class="card-inner">
          <h3>Discipline Level</h3>
          <div class="daybars" id="daybars"></div>
        </div>

      </section>
    </div>

    <footer class="app-footer">
      <button id="export-btn" class="text-btn">⬇ Ekspor data</button>
      <button id="import-btn" class="text-btn">⬆ Impor data</button>
      <input type="file" id="import-file" accept=".application/json,.json,application/json" hidden>
      <span id="save-status" aria-live="polite"></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
