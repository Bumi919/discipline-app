<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daily Discipline — checklist & statistik harian untuk melacak disiplin: grid kegiatan, ring progres, donut, dan diagram batang.">
  <meta name="theme-color" content="#0a0c12">
  <title>Daily Discipline — Checklist &amp; Statistik Harian</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script>
    // Terapkan tema, aksen & latar sebelum render untuk menghindari FOUC
    (function () {
      var d = document.documentElement;
      var savedTheme = localStorage.getItem("disc-v2-theme");
      d.dataset.theme = savedTheme ||
        (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      var acc = localStorage.getItem("disc-v2-accent");
      d.dataset.accent = ["indigo", "sky", "emerald", "amber", "rose", "violet"].includes(acc) ? acc : "indigo";
      var bg = localStorage.getItem("disc-v2-bg");
      d.dataset.bg = ["graphite", "navy", "forest", "plum", "sand"].includes(bg) ? bg : "graphite";
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <h1>Daily Discipline</h1>
      </div>
      <div class="header-controls">
        <div class="swatches" role="group" aria-label="Pilih warna aksen">
          <button class="swatch" data-accent="indigo"  aria-label="Aksen indigo"  title="Indigo"></button>
          <button class="swatch" data-accent="sky"     aria-label="Aksen biru"    title="Biru langit"></button>
          <button class="swatch" data-accent="emerald" aria-label="Aksen hijau"   title="Hijau emerald"></button>
          <button class="swatch" data-accent="amber"   aria-label="Aksen amber"   title="Amber"></button>
          <button class="swatch" data-accent="rose"    aria-label="Aksen rose"    title="Rose"></button>
          <button class="swatch" data-accent="violet"  aria-label="Aksen violet"  title="Violet"></button>
        </div>
        <div class="swatches" role="group" aria-label="Pilih warna latar">
          <button class="swatch bg-swatch" data-bg="graphite" aria-label="Latar graphite" title="Graphite"></button>
          <button class="swatch bg-swatch" data-bg="navy"     aria-label="Latar navy"     title="Navy"></button>
          <button class="swatch bg-swatch" data-bg="forest"   aria-label="Latar hijau hutan" title="Hijau hutan"></button>
          <button class="swatch bg-swatch" data-bg="plum"     aria-label="Latar plum"     title="Plum"></button>
          <button class="swatch bg-swatch" data-bg="sand"     aria-label="Latar hangat"   title="Hangat"></button>
        </div>
        <button id="theme-toggle" class="icon-btn theme-toggle" aria-label="Ganti tema terang/gelap" title="Ganti tema"></button>
      </div>
    </header>

    <div class="dashboard">
      <!-- ============ DAILY ACTIVITIES (kesamping) ============ -->
      <section class="panel">
        <div class="panel-head">
          <h2>Daily Activities</h2>
          <div class="toolbar mini">
            <button id="prev-month2" class="icon-btn" title="Bulan sebelumnya" aria-label="Bulan sebelumnya">‹</button>
            <button id="picker-trigger" class="month-trigger" title="Pilih bulan & tahun" aria-haspopup="dialog">
              <span id="month-label2" class="month-label">—</span><i class="chev" aria-hidden="true">▾</i>
            </button>
            <button id="next-month2" class="icon-btn" title="Bulan berikutnya" aria-label="Bulan berikutnya">›</button>
            <div class="month-picker" id="month-picker">
              <div class="mp-head">
                <button class="mp-ybtn" id="mp-prev-year" title="Tahun sebelumnya" aria-label="Tahun sebelumnya">‹</button>
                <b id="mp-year">—</b>
                <button class="mp-ybtn" id="mp-next-year" title="Tahun berikutnya" aria-label="Tahun berikutnya">›</button>
              </div>
              <div class="mp-grid" id="mp-grid"></div>
            </div>
          </div>
        </div>

        <div class="grid-scroll" id="grid-scroll">
          <table class="sheet matrix" id="matrix"></table>
        </div>
      </section>

      <!-- ============ STATISTIK & DISCIPLINE LEVEL ============ -->
      <section class="panel">
        <div class="panel-head">
          <h2>Statistik</h2>
          <span class="muted" id="month-label">—</span>
        </div>

        <div class="stat-hero">
          <div class="ring" id="ring-progres">
            <div class="ring-hole">
              <b id="ring-pct">0%</b>
              <small>progres</small>
            </div>
          </div>
          <div class="cards" id="summary-grid"></div>
        </div>

        <div class="card-inner">
          <h3>Discipline Level</h3>
          <div class="donut-wrap">
            <div class="donut" id="donut-dist">
              <div class="donut-hole"><b id="donut-total">0%</b></div>
            </div>
            <ul class="donut-legend" id="donut-legend"></ul>
          </div>
        </div>

        <div class="card-inner">
          <h3>Ritme Harian</h3>
          <div class="daybars" id="daybars"></div>
        </div>

      </section>
    </div>

    <footer class="app-footer">
      <button id="export-btn" class="text-btn">⬇ Ekspor data</button>
      <button id="import-btn" class="text-btn">⬆ Impor data</button>
      <input type="file" id="import-file" accept=".application/json,.json,application/json" hidden>
      <span id="save-status" aria-live="polite"></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
